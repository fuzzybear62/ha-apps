name: Static ARP table
version: "2.3.4"
slug: static_arp
description: Pin static ARP entries in the host table (repeater broadcast black-hole workaround)
arch:
  - aarch64
startup: services
boot: auto
init: false
host_network: true
hassio_api: true
privileged:
  - NET_ADMIN
options:
  refresh_seconds: 60
  entries:
    - ip: 192.168.188.51
      mac: "48:22:54:c3:46:80"
      name: esternacitofonocam
schema:
  refresh_seconds: int(10,3600)
  entries:
    - ip: "match(^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$)"
      mac: "match(^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)"
      name: str?
